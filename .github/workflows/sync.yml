name: playlist-sync

on:
  schedule:
    - cron: "17 19 * * *"   # 毎日 04:17 JST
  # config.yaml を変更したら、id のない再生リストをすぐ作る（作成だけ。読み取り・追加はしない）
  push:
    branches: [main]
    paths: ["config.yaml"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "書き込みせず予定だけ表示"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: playlist-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'   # main ブランチ以外では実行しない
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # config.yaml と Secrets が揃っているリポジトリでだけ動く（公開用リポジトリでは何もしない）
      - name: Check setup
        id: check
        env:
          HAS_TOKEN: ${{ secrets.YT_TOKEN_URL != '' || secrets.YT_REFRESH_TOKEN != '' }}
        run: |
          if [ -f config.yaml ] && [ "$HAS_TOKEN" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::config.yaml または Secrets がないため同期をスキップしました"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.check.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Sync
        if: steps.check.outputs.ok == 'true'
        env:
          YT_TOKEN_URL: ${{ secrets.YT_TOKEN_URL }}
          YT_TOKEN_SECRET: ${{ secrets.YT_TOKEN_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          # 追加の提案の決定（ミックスAPIの画面で選んだもの）を読む。なくても動く
          MIX_WORKER_URL: ${{ secrets.MIX_WORKER_URL }}
          MIX_SYNC_KEY: ${{ secrets.MIX_SYNC_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: >-
          python -m ytpl.sync
          ${{ github.event_name == 'push' && '--create-only' || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Commit backup
        if: steps.check.outputs.ok == 'true' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.yaml data reports
          git diff --cached --quiet || git commit -m "sync: $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
          # 実行中に config.yaml を手で編集・push していた場合に備えて取り込んでから push
          git pull --rebase --autostash origin main
          git push
