name: check-config

# GitHub上で直接編集した場合など、コミット前フックを通らない変更も確認する
on:
  push:
    paths: ["config.yaml"]
  pull_request:
    paths: ["config.yaml"]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # 確認だけなので、push 用の認証情報を残さない
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m ytpl.check config.yaml
