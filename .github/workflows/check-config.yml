name: check-config

# GitHub上で直接編集した場合など、コミット前フックを通らない変更も確認する
on:
  push:
    paths: ["config.yaml"]
  pull_request:
    paths: ["config.yaml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ytpl.check config.yaml
