# 依存の更新をプルリクエストで知らせる（SHA で固定した Actions も、新しい SHA に更新される）
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /worker
    schedule:
      interval: monthly
