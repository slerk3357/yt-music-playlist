# ===== yt-music-playlist 設定の例 =====
# 各フィールドの仕様は docs/config.md を参照してください。
# ・文字列はすべてダブルクオート（"…"）で囲みます（囲んでいないとエラーで止まります）。
# ・チャンネル・再生リストは {id, name} の組で書きます。判別には id だけを使い、name は表示・確認用です。
# ・このファイルはシステムが書き換えることはありません（コメントもそのまま残ります）。

playlist_privacy: "private"     # 新しく作る再生リストの公開設定

quota:
  daily_budget: 9000

playlists:
  unsorted: {id: "PLxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", name: "未仕分け"}
  misc: {id: "PLxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", name: "その他の曲"}

music:
  categories: ["10"]
  include_keywords: ["歌ってみた", "うたってみた", "cover", "カバー", "MV", "Music Video", "オリジナル曲", "Original Song", "弾き語り", "feat."]
  exclude_keywords: ["#shorts", "切り抜き", "歌枠", "配信", "雑談", "告知", "予告", "teaser", "trailer", "クロスフェード", "XFD", "short ver", "ショート"]
  min_seconds: 61
  max_seconds: 900

matching:
  use_description: true

dedupe:
  enabled: true

promotion:
  enabled: true
  min_versions: 5
  ignore: []

ignore_video_ids: []

# ===== チャンネル =====
top_favorites:
  - name: "歌い手A"
    channels:
      - {id: "UCaaaaaaaaaaaaaaaaaaaaaa", name: "歌い手A"}
      - {id: "UCbbbbbbbbbbbbbbbbbbbbbb", name: "歌い手A - Topic"}
    playlist: {id: "PLxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", name: "歌い手Aチャンネル"}
    other_playlist: {id: "PLxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", name: "その他歌い手A"}
    specials:
      # 作曲者Bが公開した、歌い手Aがボーカルの曲（「その他歌い手A」からは除外される）
      - playlist: {name: "作曲者B×歌い手A"}
        published_by:
          - {id: "UCcccccccccccccccccccccc", name: "作曲者B"}

favorites:
  - name: "作曲者B"
    channels:
      - {id: "UCcccccccccccccccccccccc", name: "作曲者B"}
    playlist: {id: "PLxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", name: "作曲者Bチャンネル"}
    specials:
      # 作曲者B本人が歌ったセルフカバー
      - playlist: {name: "作曲者Bセルフカバー"}
        published_by:
          - {id: "UCcccccccccccccccccccccc", name: "作曲者B"}
        keywords: ["self cover", "セルフカバー"]

occasional:
  - name: "歌い手D"
    channels:
      - {id: "UCdddddddddddddddddddddd", name: "歌い手D"}
    specials:
      # 歌い手Dの曲のうち、歌い手Eが関わっているもの
      - playlist: {name: "歌い手D×歌い手E"}
        mentions:
          - {id: "UCeeeeeeeeeeeeeeeeeeeeee", name: "歌い手E"}
        mention_aliases: ["歌い手E"]

# ===== お気に入りの曲 =====
songs:
  - name: "曲名X"
    playlist: {id: "PLxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx", name: "曲名X"}
    aliases: ["曲名X", "Kyokumei X"]
    official_channels:
      - {id: "UCffffffffffffffffffffff", name: "曲名Xの公式チャンネル"}
