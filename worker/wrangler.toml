# オリジナルミックスリスト API（Cloudflare Worker）
# Cloudflare のダッシュボードからリポジトリを接続して自動デプロイする（README の「オリジナルミックスリスト」）。
# ダッシュボードの Worker 名は、ここの name と同じにする必要がある。
name = "yt-music-mix"
main = "src/entry.js"
compatibility_date = "2026-11-01"

# ダッシュボードで追加した変数を、デプロイのたびに消さない
keep_vars = true

# デプロイの前に、リポジトリの data/mix/index.json を Worker に組み込む
[build]
command = "node build.mjs"

# 次の値は、このファイルには書かずにダッシュボードの「変数とシークレット」で登録する（どちらも任意）
#   ALLOWED_EMAILS : 使ってよいアカウントのメールアドレス（複数ならカンマ区切り）。Access のポリシーに加えた二重の確認
#   ACCESS_KEY     : URL の先頭に付ける合言葉
